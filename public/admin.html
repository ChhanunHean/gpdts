<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GPDTS Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;700&family=Noto+Sans+Khmer:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  --bg: #eef3ee;
  --sf: #fff;
  --ink: #10231f;
  --mute: #586c65;
  --line: #d5e0d9;
  --brass: #8f6212;
  --jade: #2f7a63;
  --bar: #0e1f1c;
  --barink: #e9f1ec;
  --gold: #e0ad55;
}
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0b1a17;--sf:#132925;--ink:#eaf1ec;--mute:#9db3aa;--line:#24413a;--brass:#e0ad55;--jade:#7fc9ac;
  }
}
:root[data-theme="dark"]{
  --bg:#0b1a17;--sf:#132925;--ink:#eaf1ec;--mute:#9db3aa;--line:#24413a;--brass:#e0ad55;--jade:#7fc9ac;
}
:root[data-theme="light"]{
  --bg:#eef3ee;--sf:#fff;--ink:#10231f;--mute:#586c65;--line:#d5e0d9;--brass:#8f6212;--jade:#2f7a63;--bar:#0e1f1c;--barink:#e9f1ec;--gold:#e0ad55;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
body{font:400 15px/1.55 'Figtree',system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
h1,h2,h3,.bar h1{font-family:'Bricolage Grotesque','Figtree',system-ui,sans-serif;margin:0;line-height:1.15;color:var(--brass)}
.bar{background:var(--bar);color:var(--barink);padding:12px 20px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
.bar h1{font-size:1.15rem;color:var(--gold)}
.bar .sp{flex:1}
.btn{border:0;border-radius:99px;padding:8px 18px;font:700 .85rem 'Figtree',sans-serif;cursor:pointer;transition:transform .1s,opacity .15s}
.btn:active{transform:scale(.97)}
.btn-gold{background:var(--gold);color:#1a1200}
.btn-jade{background:var(--jade);color:#fff}
.btn-danger{background:#dc2626;color:#fff}
.btn-ghost{background:none;border:1px solid var(--line);color:var(--mute)}
.btn-pill{border:1px solid rgba(233,241,236,.4);background:none;color:var(--barink);border-radius:99px;padding:5px 14px;font-weight:700;font-size:.8rem}
.main{max-width:960px;margin:0 auto;padding:24px 16px}
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:80vh}
.card{background:var(--sf);border:1px solid var(--line);border-radius:16px;padding:24px;box-shadow:0 4px 20px rgba(0,0,0,.04)}
.card h2{margin-bottom:16px;font-size:1.3rem}
label{display:block;font-size:.85rem;color:var(--mute);margin-bottom:5px;margin-top:14px;font-weight:600}
input,textarea,select{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:10px 14px;font:inherit;font-size:.9rem}
input:focus,textarea:focus,select:focus{outline:2px solid var(--gold);border-color:var(--gold);background:color-mix(in srgb, var(--gold) 6%, var(--bg))}
.tabs{display:flex;gap:8px;margin-bottom:24px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--sf);color:var(--mute);border-radius:99px;padding:8px 18px;font:600 .88rem 'Figtree',sans-serif;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.tab.on{background:var(--gold);color:#1a1200;border-color:var(--gold);font-weight:700}
table{width:100%;border-collapse:collapse;background:var(--sf);border:1px solid var(--line);border-radius:14px;overflow:hidden}
th{background:var(--bar);color:var(--barink);font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;padding:12px 14px;text-align:left;font-weight:700}
td{padding:12px 14px;border-top:1px solid var(--line);font-size:.9rem;vertical-align:middle}
tr:hover td{background:color-mix(in srgb, var(--jade) 5%, transparent)}
.badge{display:inline-block;padding:4px 10px;border-radius:99px;font-size:.75rem;font-weight:700}
.badge-pray{background:color-mix(in srgb, var(--gold) 20%, transparent);color:var(--brass);border:1px solid var(--brass)}
.badge-ok{background:color-mix(in srgb, var(--jade) 20%, transparent);color:var(--jade);border:1px solid var(--jade)}
.modal-bg{position:fixed;inset:0;background:rgba(5,12,10,.6);z-index:20;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--sf);border:1px solid var(--line);border-radius:20px;padding:26px;width:100%;max-width:500px;max-height:90vh;overflow-y:auto;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.modal h3{margin-bottom:12px;font-size:1.3rem}
.row{display:flex;gap:8px;align-items:center;margin-top:12px}
.err{color:#ef4444;font-size:.85rem;margin-top:8px;font-weight:600}
.success{color:#10b981;font-size:.85rem;margin-top:8px;font-weight:600}
</style>
</head>
<body>

<div id="root"></div>

<script>
const API = '/api';
let token = localStorage.getItem('gpdts_token');
let adminUser = localStorage.getItem('gpdts_user');
let view = 'students';
let data = null;
let modal = null;
let msg = '';
let msgType = 'success';

// ── Theme Sync with Frontend ───────────────────────────────
function initTheme() {
  const saved = localStorage.getItem('gpdts_theme');
  if (saved) {
    document.documentElement.dataset.theme = saved;
  }
}
function toggleTheme() {
  const cur = document.documentElement.dataset.theme || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  localStorage.setItem('gpdts_theme', next);
  render();
}
initTheme();

// ── Auth ───────────────────────────────────────────────────
async function login(username, password) {
  const res = await fetch(`${API}/admin/login`, {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({username, password})
  });
  const j = await res.json();
  if (!res.ok) throw new Error(j.error || 'Login failed');
  token = j.token;
  adminUser = j.username;
  localStorage.setItem('gpdts_token', token);
  localStorage.setItem('gpdts_user', adminUser);
  await loadData();
  render();
}

function logout() {
  token = null; adminUser = null; data = null;
  localStorage.removeItem('gpdts_token');
  localStorage.removeItem('gpdts_user');
  render();
}

// ── API helpers ────────────────────────────────────────────
async function api(method, path, body) {
  const res = await fetch(`${API}/admin${path}`, {
    method,
    headers:{'Content-Type':'application/json','Authorization':`Bearer ${token}`},
    body: body ? JSON.stringify(body) : undefined
  });
  const j = await res.json();
  if (!res.ok) throw new Error(j.error || 'Request failed');
  return j;
}

async function loadData() {
  const [event, students] = await Promise.all([
    fetch(`${API}/event`).then(r=>r.json()),
    api('GET','/students')
  ]);
  data = { event, students };
}

// ── Student CRUD ───────────────────────────────────────────
async function saveStudent(form) {
  const payload = {
    name: form.name.value.trim(),
    nick: form.nick.value.trim() || null,
    from_location: form.from_location.value.trim(),
    born: form.born.value || null,
    gender: form.gender.value,
    pray: form.pray.checked,
    sort_order: parseInt(form.sort_order.value) || 0
  };
  try {
    if (form.dataset.id) {
      await api('PUT', `/students/${form.dataset.id}`, payload);
    } else {
      await api('POST', '/students', payload);
    }
    modal = null;
    msg = 'Student saved!'; msgType = 'success';
    await loadData(); render();
  } catch(e) {
    msg = e.message; msgType = 'err';
    render();
  }
}

async function deleteStudent(id, name) {
  if (!confirm(`Delete ${name}?`)) return;
  try {
    await api('DELETE', `/students/${id}`);
    msg = 'Deleted.'; msgType = 'success';
    await loadData(); render();
  } catch(e) {
    msg = e.message; msgType = 'err'; render();
  }
}

// ── Goals CRUD ─────────────────────────────────────────────
async function saveGoals(form) {
  const outreach = form.outreach.value.trim().split('\n').filter(Boolean);
  const classroom = form.classroom.value.trim().split('\n').filter(Boolean);
  try {
    await api('PUT', '/goals', { outreach, classroom });
    msg = 'Goals updated!'; msgType = 'success';
    await loadData(); render();
  } catch(e) {
    msg = e.message; msgType = 'err'; render();
  }
}

// ── Finances CRUD (Admin Full Permission) ───────────────────
async function saveFees(form) {
  const fees = {
    lecture: Number(form.lecture.value),
    outreach: Number(form.outreach.value),
    currency: form.currency.value.trim(),
    account: form.account.value.trim(),
    accountName: form.accountName.value.trim(),
    note: form.note.value.trim()
  };
  try {
    await api('PUT', '/finances', { fees });
    if (!data.event.fees) data.event.fees = {};
    Object.assign(data.event.fees, fees);
    msg = 'School fees & payment details updated!'; msgType = 'success';
    render();
  } catch(e) {
    msg = e.message; msgType = 'err'; render();
  }
}

async function saveBudget(form) {
  const budget = {
    goal: Number(form.goal.value),
    raised: Number(form.raised.value),
    currency: 'USD'
  };
  try {
    await api('PUT', '/finances', { budget });
    if (!data.event.budget) data.event.budget = {};
    Object.assign(data.event.budget, budget);
    msg = 'Outreach mission budget updated!'; msgType = 'success';
    render();
  } catch(e) {
    msg = e.message; msgType = 'err'; render();
  }
}

async function saveStudentFees(form) {
  const student_payments = data.students.map(s => {
    const dueInput = form.querySelector(`input[name="due_${s.id}"]`);
    const paidInput = form.querySelector(`input[name="paid_${s.id}"]`);
    return {
      id: s.id,
      fee_due: dueInput ? Number(dueInput.value) : s.fee_due,
      fee_paid: paidInput ? Number(paidInput.value) : s.fee_paid
    };
  });
  try {
    await api('PUT', '/finances', { student_payments });
    student_payments.forEach(sp => {
      const match = data.students.find(s => s.id === sp.id);
      if (match) { match.fee_due = sp.fee_due; match.fee_paid = sp.fee_paid; }
    });
    msg = 'Student tuition and payments saved!'; msgType = 'success';
    render();
  } catch(e) {
    msg = e.message; msgType = 'err'; render();
  }
}

// ── Render ─────────────────────────────────────────────────
function render() {
  document.getElementById('root').innerHTML = token ? renderApp() : renderLogin();

  // Attach form handlers
  const lf = document.getElementById('login-form');
  if (lf) lf.onsubmit = async e => {
    e.preventDefault();
    const u = document.getElementById('username').value;
    const p = document.getElementById('password').value;
    const errEl = document.getElementById('login-err');
    try { await login(u, p); } catch(e2) { errEl.textContent = e2.message; }
  };

  const sf = document.getElementById('student-form');
  if (sf) sf.onsubmit = e => { e.preventDefault(); saveStudent(sf); };

  const gf = document.getElementById('goals-form');
  if (gf) gf.onsubmit = e => { e.preventDefault(); saveGoals(gf); };

  const ff = document.getElementById('fees-form');
  if (ff) ff.onsubmit = e => { e.preventDefault(); saveFees(ff); };

  const bf = document.getElementById('budget-form');
  if (bf) bf.onsubmit = e => { e.preventDefault(); saveBudget(bf); };

  const stf = document.getElementById('student-fees-form');
  if (stf) stf.onsubmit = e => { e.preventDefault(); saveStudentFees(stf); };
}

function renderLogin() {
  return `
    <div class="login-wrap">
      <div class="card" style="width:100%;max-width:380px">
        <h2>🔐 GPDTS Admin</h2>
        <p style="color:var(--mute);font-size:.9rem;margin-bottom:12px">Sign in with your Director credentials to manage students and finances.</p>
        <form id="login-form">
          <label>Username</label>
          <input id="username" type="text" autocomplete="username" placeholder="Pheareak Training director" required>
          <label>Password</label>
          <input id="password" type="password" autocomplete="current-password" placeholder="••••••••" required>
          <div id="login-err" class="err"></div>
          <button class="btn btn-gold" style="width:100%;margin-top:20px;padding:10px">Sign In</button>
        </form>
      </div>
    </div>`;
}

function renderApp() {
  if (!data) return '<div style="padding:60px;text-align:center;color:var(--mute)">Loading admin panel…</div>';
  const { event, students } = data;

  const tabs = [
    { id:'students', label:'👥 Students' },
    { id:'finances', label:'💰 Money & Fees' },
    { id:'goals',    label:'🎯 Goals' },
    { id:'event',    label:'ℹ️ Event Info' },
  ];

  const msgHtml = msg ? `<p class="${msgType}" style="margin-bottom:14px">${msg}</p>` : '';

  let content = '';

  if (view === 'students') {
    content = `
      ${msgHtml}
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
        <div>
          <h2 style="font-size:1.4rem">Students Roster</h2>
          <span style="color:var(--mute);font-size:.85rem">${students.length} students enrolled in GPDTS 2026</span>
        </div>
        <button class="btn btn-jade" onclick="modal='new';msg='';render()">+ Add Student</button>
      </div>
      <table>
        <thead><tr><th>Name</th><th>From</th><th>Gender</th><th>Born</th><th>Prayer</th><th>Actions</th></tr></thead>
        <tbody>
          ${students.map(s=>`<tr>
            <td><strong>${s.name}</strong>${s.nick?` <span style="color:var(--mute);font-size:.8rem">(${s.nick})</span>`:''}</td>
            <td>${s.from_location||'—'}</td>
            <td>${s.gender||'—'}</td>
            <td>${s.born ? new Date(s.born).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}) : '—'}</td>
            <td><span class="badge ${s.pray?'badge-pray':'badge-ok'}">${s.pray?'🙏 Needs prayer':'✓ Saved'}</span></td>
            <td>
              <button class="btn btn-ghost" style="font-size:.8rem;padding:4px 12px;margin-right:6px" onclick='modal=${JSON.stringify(s)};msg="";render()'>Edit</button>
              <button class="btn btn-danger" style="font-size:.8rem;padding:4px 12px" onclick="deleteStudent(${s.id},'${s.name.replace(/'/g,"\\'")}')">Delete</button>
            </td>
          </tr>`).join('')}
        </tbody>
      </table>
      ${renderStudentModal()}`;
  }

  if (view === 'finances') {
    const fees = data.event.fees || { lecture: 1200, outreach: 1800, currency: 'USD', account: '000 123 456 (ABA Bank)', accountName: 'GPDTS Poipet Ministry', note: '' };
    const budget = data.event.budget || { goal: 15000, raised: 6850, currency: 'USD' };
    const pct = Math.min(100, Math.round((budget.raised / (budget.goal || 1)) * 100));

    // Calculate student payment totals
    let totalDue = 0, totalPaid = 0;
    students.forEach(s => {
      totalDue += (Number(s.fee_due) || 1500);
      totalPaid += (Number(s.fee_paid) || 0);
    });

    content = `
      ${msgHtml}
      <div style="display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));margin-bottom:20px">
        <div class="card" style="border-left:5px solid var(--jade)">
          <h2 style="font-size:1.1rem;color:var(--jade)">💵 Tuition Collected</h2>
          <p style="font-size:2rem;font-weight:800;color:var(--ink);font-family:'Bricolage Grotesque',sans-serif">$${totalPaid.toLocaleString()} <span style="font-size:.9rem;color:var(--mute)">/ $${totalDue.toLocaleString()}</span></p>
          <div style="height:6px;background:var(--bg);border-radius:99px;overflow:hidden;margin-top:8px">
            <div style="width:${Math.min(100, Math.round((totalPaid/(totalDue||1))*100))}%;height:100%;background:var(--jade)"></div>
          </div>
        </div>
        <div class="card" style="border-left:5px solid var(--gold)">
          <h2 style="font-size:1.1rem;color:var(--brass)">🌏 Outreach Budget Goal</h2>
          <p style="font-size:2rem;font-weight:800;color:var(--ink);font-family:'Bricolage Grotesque',sans-serif">$${budget.raised.toLocaleString()} <span style="font-size:.9rem;color:var(--mute)">/ $${budget.goal.toLocaleString()}</span></p>
          <div style="height:6px;background:var(--bg);border-radius:99px;overflow:hidden;margin-top:8px">
            <div style="width:${pct}%;height:100%;background:var(--gold)"></div>
          </div>
        </div>
      </div>

      <div class="card" style="margin-bottom:20px">
        <h2>💰 School Tuition & Bank Account Details</h2>
        <form id="fees-form">
          <div style="display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))">
            <div>
              <label>Lecture Phase Fee ($)</label>
              <input name="lecture" type="number" value="${fees.lecture}" required>
            </div>
            <div>
              <label>Outreach Phase Fee ($)</label>
              <input name="outreach" type="number" value="${fees.outreach}" required>
            </div>
            <div>
              <label>Currency</label>
              <input name="currency" value="${fees.currency || 'USD'}" required>
            </div>
          </div>
          <label>Bank Account / ABA Number</label>
          <input name="account" value="${fees.account || ''}" placeholder="e.g. 000 123 456 (ABA Bank)">
          <label>Account Holder Name</label>
          <input name="accountName" value="${fees.accountName || ''}" placeholder="e.g. GPDTS Poipet Ministry">
          <label>Payment Instructions / Notes</label>
          <textarea name="note" rows="2">${fees.note || ''}</textarea>
          <button class="btn btn-gold" style="margin-top:16px">Update School Fees & Bank Info</button>
        </form>
      </div>

      <div class="card" style="margin-bottom:20px">
        <h2>🌏 Outreach Mission Budget</h2>
        <form id="budget-form">
          <div style="display:grid;gap:12px;grid-template-columns:1fr 1fr">
            <div>
              <label>Total Budget Target ($)</label>
              <input name="goal" type="number" value="${budget.goal}" required>
            </div>
            <div>
              <label>Total Amount Raised ($)</label>
              <input name="raised" type="number" value="${budget.raised}" required>
            </div>
          </div>
          <button class="btn btn-gold" style="margin-top:16px">Update Outreach Budget</button>
        </form>
      </div>

      <div class="card">
        <h2>👥 Student Tuition Payment Tracker</h2>
        <p style="color:var(--mute);font-size:.85rem;margin-bottom:12px">Update tuition fees and recorded payments for each student. Only logged-in Admin can edit these values.</p>
        <form id="student-fees-form">
          <table>
            <thead>
              <tr>
                <th>Student</th>
                <th>Fee Due ($)</th>
                <th>Amount Paid ($)</th>
                <th>Balance Remaining</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody>
              ${students.map((s, idx) => {
                const due = Number(s.fee_due) || 1500;
                const paid = Number(s.fee_paid) || 0;
                const remaining = Math.max(0, due - paid);
                const isPaid = remaining === 0;
                return `<tr>
                  <td><strong>${s.name}</strong>${s.nick ? ` (${s.nick})` : ''}</td>
                  <td><input type="number" name="due_${s.id}" value="${due}" style="width:110px;padding:6px 10px"></td>
                  <td><input type="number" name="paid_${s.id}" value="${paid}" style="width:110px;padding:6px 10px"></td>
                  <td style="color:${isPaid ? 'var(--jade)' : 'var(--brass)'};font-weight:700">$${remaining.toLocaleString()}</td>
                  <td><span class="badge ${isPaid ? 'badge-ok' : 'badge-pray'}">${isPaid ? '✓ Paid in Full' : '⏳ Pending'}</span></td>
                </tr>`;
              }).join('')}
            </tbody>
          </table>
          <button class="btn btn-jade" style="margin-top:16px">Save All Student Payments</button>
        </form>
      </div>`;
  }

  if (view === 'goals') {
    const g = event.goals;
    content = `
      ${msgHtml}
      <div class="card">
        <h2>Edit Goals</h2>
        <form id="goals-form">
          <label>Outreach Goals (one per line)</label>
          <textarea name="outreach" rows="6">${g.outreach.join('\n')}</textarea>
          <label>Classroom Goals (one per line)</label>
          <textarea name="classroom" rows="5">${g.classroom.join('\n')}</textarea>
          <button class="btn btn-gold" style="margin-top:16px">Save Goals</button>
        </form>
      </div>`;
  }

  if (view === 'event') {
    const m = event.meta;
    const p = event.pray;
    content = `
      ${msgHtml}
      <div class="card">
        <h2>Event Info</h2>
        <div style="margin-top:16px;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--bg)">
          <p><strong>Brand:</strong> ${m.brand}</p>
          <p style="margin-top:6px"><strong>Kicker:</strong> ${m.kicker}</p>
          <p style="margin-top:6px"><strong>Lede:</strong> ${m.lede}</p>
          <p style="margin-top:10px;color:var(--brass)"><strong>Prayer focus:</strong> ${p.title}</p>
          <p style="margin-top:4px;color:var(--mute)">${p.text}</p>
        </div>
      </div>`;
  }

  return `
    <div class="bar">
      <h1>GPDTS Admin</h1>
      <span class="sp"></span>
      <button class="btn-pill" onclick="toggleTheme()">🌓 Theme</button>
      <span style="color:var(--barink);font-size:.85rem;margin-left:8px;font-weight:600">${adminUser}</span>
      <button class="btn-pill" onclick="logout()" style="margin-left:8px">Sign out</button>
    </div>
    <div class="main">
      <div class="tabs">${tabs.map(t=>`
        <button class="tab${view===t.id?' on':''}" onclick="view='${t.id}';msg='';render()">${t.label}</button>`).join('')}
        <a href="/" target="_blank" class="tab" style="text-decoration:none">↗ Public Site</a>
      </div>
      ${content}
    </div>`;
}

function renderStudentModal() {
  if (!modal) return '';
  const isNew = modal === 'new';
  const s = isNew ? {} : modal;
  return `
    <div class="modal-bg" onclick="modal=null;render()">
      <div class="modal" onclick="event.stopPropagation()">
        <h3>${isNew ? 'Add Student' : 'Edit Student'}</h3>
        <form id="student-form" ${isNew ? '' : `data-id="${s.id}"`}>
          <label>Full Name *</label>
          <input name="name" value="${s.name||''}" required>
          <label>Nickname</label>
          <input name="nick" value="${s.nick||''}">
          <label>From (location)</label>
          <input name="from_location" value="${s.from_location||''}">
          <label>Date of Birth</label>
          <input name="born" type="date" value="${s.born ? s.born.slice(0,10) : ''}">
          <label>Gender</label>
          <select name="gender">
            <option ${s.gender==='Male'?'selected':''}>Male</option>
            <option ${s.gender==='Female'?'selected':''}>Female</option>
          </select>
          <label>Sort Order</label>
          <input name="sort_order" type="number" value="${s.sort_order||0}">
          <div class="row">
            <input name="pray" type="checkbox" style="width:auto;accent-color:var(--gold)" ${s.pray?'checked':''}>
            <label style="margin:0">Needs prayer to know God</label>
          </div>
          <div style="display:flex;gap:10px;margin-top:20px">
            <button class="btn btn-gold" type="submit">${isNew?'Add':'Save'}</button>
            <button class="btn btn-ghost" type="button" onclick="modal=null;render()">Cancel</button>
          </div>
        </form>
      </div>
    </div>`;
}

// ── Boot ───────────────────────────────────────────────────
async function boot() {
  if (token) {
    try { await loadData(); } catch(e) { logout(); }
  }
  render();
}
boot();
</script>
</body>
</html>
