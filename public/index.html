<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#eef3ee;--sf:#fff;--ink:#10231f;--mute:#586c65;--line:#d5e0d9;--brass:#8f6212;--jade:#2f7a63;--bar:#0e1f1c;--barink:#e9f1ec;--gold:#e0ad55}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1a17;--sf:#132925;--ink:#eaf1ec;--mute:#9db3aa;--line:#24413a;--brass:#e0ad55;--jade:#7fc9ac}}
:root[data-theme="dark"]{--bg:#0b1a17;--sf:#132925;--ink:#eaf1ec;--mute:#9db3aa;--line:#24413a;--brass:#e0ad55;--jade:#7fc9ac}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 'Figtree',system-ui,sans-serif;padding-bottom:84px}
h1,h2,h3,.top b,.wn{font-family:'Bricolage Grotesque','Figtree',system-ui,sans-serif;margin:0;line-height:1.1}
html[lang=km] body,html[lang=km] h1,html[lang=km] h2,html[lang=km] h3,html[lang=km] .top b,html[lang=km] .wn{font-family:'Noto Sans Khmer','Figtree',system-ui,sans-serif;line-height:1.7}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bar);color:var(--barink);display:flex;align-items:center;gap:8px;padding:10px 16px}
.top b{font-size:1.1rem}.top img{width:28px;height:28px}.sp{flex:1}
.pill{border:1px solid rgba(233,241,236,.4);background:none;color:var(--barink);border-radius:99px;padding:6px 14px;font-weight:700;font-size:.85rem}
.pill.on{background:var(--gold);color:#1a1200;border-color:var(--gold)}
main{max-width:1000px;margin:0 auto;padding:20px 16px}
.hero h1{font-size:clamp(3.6rem,18vw,8rem);font-weight:800;color:var(--brass);letter-spacing:-.04em}
.lede{max-width:32em;font-size:1.15rem;margin:12px 0 0}
.mute,.where{color:var(--mute)}.where{margin:6px 0 0;font-weight:500}
.faces{display:flex;margin:26px 0 6px;padding-left:12px}
.faces img{width:clamp(38px,9vw,64px);height:clamp(38px,9vw,64px);border-radius:50%;object-fit:cover;border:3px solid var(--bg);margin-left:-12px;animation:pop .5s both;animation-delay:calc(var(--i)*60ms)}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.85)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.nums{display:flex;gap:26px;margin:14px 0 26px;color:var(--mute)}.nums b{font-size:1.25rem;color:var(--jade)}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.box{background:var(--sf);border:1px solid var(--line);border-radius:16px;padding:20px}
.box h2{font-size:1.4rem;margin-bottom:10px}
.pray{border-left:6px solid var(--gold)}
.who{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{border:1px solid var(--brass);color:var(--brass);background:none;border-radius:99px;padding:6px 14px;font-weight:700;display:inline-block}
.pil{padding:12px 0;border-top:1px solid var(--line)}.pil:first-of-type{border:0;padding-top:0}
.pil h3,.sub{font-size:1.05rem;color:var(--jade)}.sub{margin:16px 0 4px}.pil p{margin:4px 0 0}
.ck{list-style:none;padding:0;margin:0}.ck li{padding:8px 0 8px 26px;border-top:1px solid var(--line);position:relative}
.ck li::before{content:"✓";position:absolute;left:0;color:var(--brass);font-weight:700}
.people{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.card{background:var(--sf);border:1px solid var(--line);border-radius:16px;overflow:hidden;text-align:left;padding:0;display:block;width:100%}
.card img{width:100%;aspect-ratio:1/1.1;object-fit:cover;display:block}.card>div{padding:10px 12px 14px}
.round .card{text-align:center}.round .card img{width:112px;height:112px;aspect-ratio:auto;border-radius:50%;margin:16px auto 0;border:3px solid var(--gold)}
.wk,.slot{display:grid;grid-template-columns:56px 1fr;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.wk:first-of-type{border:0}.wn{font-size:1.8rem;font-weight:800;color:var(--brass);text-align:center}.wn small{display:block;font:600 .7rem 'Figtree',sans-serif;color:var(--jade)}
ul.pl{margin:0;padding-left:18px}ul.pl li{margin-bottom:4px}
.days{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.day{border:1px solid var(--line);background:var(--sf);border-radius:99px;padding:8px 16px;font-weight:600;flex:0 0 auto}
.day.on{background:var(--jade);color:var(--bg);border-color:var(--jade)}
.slot{padding:9px 0}.slot:first-child{border:0}.slot time{color:var(--jade);font-weight:700}
.slot.ses{background:color-mix(in srgb,var(--jade) 16%,transparent);border-left:4px solid var(--jade);border-radius:8px;padding:10px;margin:4px 0;font-weight:700}
.rg{display:block;font-weight:600;color:var(--mute)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;justify-content:space-around;background:var(--bar);color:var(--barink);padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px))}
.tab{background:none;border:0;opacity:.6;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.66rem;padding:4px 2px;flex:1;min-width:0}
.tab.on{opacity:1;color:var(--gold)}.tab svg{width:22px;height:22px}
@media(min-width:820px){.tabs{position:static;justify-content:center;gap:8px;padding:8px}.tab{flex-direction:row;font-size:.95rem;gap:8px;padding:8px 18px;border-radius:99px;flex:none}.tab.on{background:rgba(224,173,85,.15)}body{padding-bottom:24px}}
.ov{position:fixed;inset:0;background:rgba(5,12,10,.6);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sh{background:var(--sf);width:100%;max-width:440px;border-radius:22px 22px 0 0;padding:24px 22px calc(28px + env(safe-area-inset-bottom,0px));text-align:center;animation:up .25s}
@keyframes up{from{transform:translateY(30px);opacity:0}}
@media(min-width:820px){.ov{align-items:center}.sh{border-radius:22px}}
.sh img{width:132px;height:132px;border-radius:50%;object-fit:cover;border:3px solid var(--gold)}.sh h2{margin:12px 0 4px}.sh p{margin:2px 0 12px}
.ed{outline:1px dashed var(--brass);outline-offset:2px;border-radius:4px;min-width:1.5em;display:inline-block}
.ed:focus{outline:2px solid var(--gold);background:color-mix(in srgb,var(--gold) 14%,transparent)}
.x{border:1px solid var(--line);background:var(--sf);border-radius:8px;padding:4px 10px;font-size:.8rem;margin-top:6px}
[data-a=photo]{cursor:pointer;outline:2px dashed var(--gold);outline-offset:-4px}
.bar{position:fixed;left:12px;right:12px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:7;background:var(--gold);color:#1a1200;border-radius:14px;padding:10px 14px;display:flex;gap:10px;align-items:center;font-weight:700;flex-wrap:wrap}
.bar button{border:0;border-radius:99px;padding:8px 16px;font-weight:700;background:#1a1200;color:#fff}.bar button+button{background:none;color:#1a1200;border:1px solid #1a1200}
@media(min-width:820px){.bar{bottom:20px;max-width:560px;margin:0 auto}}
.fig{display:flex;gap:28px;flex-wrap:wrap;margin-top:14px}.fig small{display:block;color:var(--mute)}.fig b{font:800 clamp(2rem,9vw,3rem)/1.1 'Bricolage Grotesque','Figtree',system-ui,sans-serif}
.fr{display:grid;grid-template-columns:1fr 92px 92px;gap:8px;padding:10px 0 4px;border-top:1px solid var(--line);align-items:baseline}
.fh{font-weight:700;color:var(--mute);border:0;padding-top:0}.fr span+span{text-align:right;font-variant-numeric:tabular-nums}
.pbw{grid-column:1/-1;height:5px;background:var(--line);border-radius:9px;overflow:hidden;margin-bottom:6px}.pbw i{display:block;height:100%;background:var(--jade)}
.pool{background:color-mix(in srgb,var(--gold) 22%,transparent);border-radius:8px;padding:8px}
</style>
</head>

<div class="box"><h2>${t('Three things this school is for')}</h2>${D.pillars.map((x,i)=>`<div class="pil"><h3>${E(`pillars.${i}.h`)}</h3><p>${E(`pillars.${i}.p`)}</p></div>`).join('')}</div>
<div class="box"><h2>${t('Goals for the year')}</h2>${[['outreach','Outreach'],['classroom','Classroom']].map(([k,l])=>`<h3 class="sub">${t(l)}</h3><ul class="ck">${D.goals[k].map((g,i)=>`<li>${E(`goals.${k}.${i}`)} ${del(`goals.${k}.${i}`)}</li>`).join('')}</ul>${add(`goals.${k}`)}`).join('')}</div></div>`},
students(){return `<div class="box"><h2>${t('The class of 2026')}</h2><p class="mute" style="margin:0">${t('Tap a face for details.')}</p></div><div class="people" style="margin-top:16px">${D.students.map((s,i)=>S.ed?
`<div class="card"><img data-a="photo" data-p="students.${i}.photo" src="${s.photo}" alt=""><div><b>${E(`students.${i}.name`)}</b><br>${t('From')} ${E(`students.${i}.from`)}<br>${t('Born')} ${E(`students.${i}.born`)}<br>${E(`students.${i}.gender`)}<br><label><input type="checkbox" data-a="pray" data-i="${i}" ${s.pray?'checked':''}> Prayer list</label><br>${del(`students.${i}`)}</div></div>`
:`<button class="card" data-a="open" data-i="${i}"><img src="${s.photo}" alt="${esc(s.name)}" loading="lazy"><div><b>${esc(s.name)}</b><br><small>${t('From')} ${esc(t(s.from))}</small><br><small>${t('Born')} ${esc(t(s.born))}</small></div></button>`).join('')}</div>${add('students')}`},
curriculum(){const L=D.teachers.local;return `<div class="box"><h2>${t('12-week curriculum')}</h2>${D.weeks.map((w,i)=>`<div class="wk"><div class="wn"><small>${t('Week')}</small>${i+1}</div><div><b>${E(`weeks.${i}.topic`)}</b><br><span class="mute">${t('Speaker')}</span> ${E(`weeks.${i}.speaker`)} ${del(`weeks.${i}`)}</div></div>`).join('')}${add('weeks')}</div>
<div class="box" style="margin-top:16px"><h3 class="sub" style="margin-top:0">${t('International teachers')}</h3><ul class="pl">${D.teachers.intl.map((n,i)=>`<li>${E(`teachers.intl.${i}`)}</li>`).join('')}</ul><h3 class="sub">${t('Local teachers')}</h3><ul class="pl">${L.map((x,i)=>`<li><b>${E(`teachers.local.${i}.n`)}</b>, ${E(`teachers.local.${i}.r`)}</li>`).join('')}</ul></div>`},
team(){return `<div class="box"><h2>${t('GPDTS staff')}</h2></div><div class="people round" style="margin-top:16px">${D.staff.map((s,i)=>`<div class="card"><img ${S.ed?`data-a="photo" data-p="staff.${i}.photo"`:''} src="${s.photo}" alt="${esc(s.name)}"><div><b>${E(`staff.${i}.name`)}</b><br><small class="mute">${E(`staff.${i}.role`)}</small>${S.ed?'<br>'+del(`staff.${i}`):''}</div></div>`).join('')}</div>${add('staff')}`},
schedule(){const d=S.day,b=`schedule.${d}.slots`;return `<div class="box"><h2>${t('Rhythm of the week')}</h2></div><div class="days" style="margin:16px 0 12px">${D.schedule.map((x,i)=>`<button class="day ${i===d?'on':''}" data-a="day" data-i="${i}">${t(x.n)}</button>`).join('')}</div><div class="box">${D.schedule[d].slots.map((s,j)=>`<div class="slot${s.s?' ses':''}"><time>${E(`${b}.${j}.t`)}</time><span>${E(`${b}.${j}.x`)}${s.s?`<small class="rg">${E(`${b}.${j}.r`)}</small>`:''}${S.ed?`<br><label><input type="checkbox" data-a="ses" data-j="${j}" ${s.s?'checked':''}> Class session</label> ${del(`${b}.${j}`)}`:''}</span></div>`).join('')}${add(b)}</div>`},
fees(){const F=D.fees,n=v=>parseFloat(String(v).replace(/[^0-9.]/g,''))||0,m=v=>'$'+n(v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}),V=p=>S.ed?E(p):`<span>${m(get(p))}</span>`,P=F.rows.reduce((a,r)=>a+n(r.paid),0)+n(F.pool),nd=r=>Math.max(0,n(F.fee)-n(r.paid)),N=F.rows.reduce((a,r)=>a+nd(r),0),dt=new Date(F.deadline+'T23:59:59'),ok=!isNaN(dt),d=Math.ceil((dt-new Date())/864e5),dl=ok?dt.toLocaleDateString(S.lang==='km'?'km-KH':'en-GB',{day:'numeric',month:'long',year:'numeric'}):F.deadline,left=!ok?'':d<0?t('Deadline passed'):`${t('Days left')}: ${d}`;
return `<div class="box"><h2>${t('School fees')}</h2><p class="mute" style="margin:0">${t('Deadline')}: <b>${S.ed?E('fees.deadline'):dl}</b> ${S.ed?'(YYYY-MM-DD)':left}</p><p class="mute" style="margin:4px 0 0">${t('Fee per student')}: <b>${V('fees.fee')}</b></p><div class="fig"><div><small>${t('Total paid')}</small><b style="color:var(--jade)">${m(P)}</b></div><div><small>${t('Total still needed')}</small><b style="color:var(--brass)">${m(N)}</b></div></div></div>
<div class="box" style="margin-top:16px"><div class="fr fh"><span>${t('Name')}</span><span>${t('Paid')}</span><span>${t('Still needed')}</span></div>${F.rows.map((r,i)=>{const T=n(F.fee),pc=T?Math.min(100,n(r.paid)/T*100):0;return `<div class="fr"><span>${E(`fees.rows.${i}.name`)}${S.ed?' '+del(`fees.rows.${i}`):''}</span><span>${V(`fees.rows.${i}.paid`)}</span><span>${m(nd(r))}</span><div class="pbw"><i style="width:${pc}%"></i></div></div>`}).join('')}${add('fees.rows')}<div class="fr pool" style="margin-top:8px"><span>${t('Pool')}</span><span>${V('fees.pool')}</span><span></span></div></div>
<div class="box" style="margin-top:16px"><h3 class="sub" style="margin-top:0">${t('Pay to')}</h3><p style="margin:0"><b>${E('fees.bank')}</b> ${E('fees.payee')}</p><p style="margin:6px 0 0;font-size:1.6rem;font-weight:800">${E('fees.account')}</p><button class="x" data-a="copy">Copy number</button></div>`},
outreach(){const O=D.outreach,n=v=>parseFloat(String(v).replace(/[^0-9.]/g,''))||0,m=v=>'$'+n(v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}),F=n(O.fee),V=p=>S.ed?E(p):`<span>${m(get(p))}</span>`,tot=O.members.reduce((a,x)=>a+n(x.paid),0),nd=x=>Math.max(0,F-n(x.paid));
return `<div class="box"><h2>${t('Outreach fee')}</h2><p class="mute" style="margin:0">${t('Fee per person')}: <b>${S.ed?E('outreach.fee'):(F?m(F):t('To be decided'))}</b></p><div class="fig"><div><small>${t('Total paid')}</small><b style="color:var(--jade)">${m(tot)}</b></div>${F?`<div><small>${t('Total still needed')}</small><b style="color:var(--brass)">${m(O.members.reduce((a,x)=>a+nd(x),0))}</b></div>`:''}</div></div>`+O.teams.map((tm,ti)=>{const mem=O.members.map((x,i)=>[x,i]).filter(([x])=>x.team===ti),sub=mem.reduce((a,[x])=>a+n(x.paid),0);return `<div class="box" style="margin-top:16px"><h2>${E(`outreach.teams.${ti}`)}</h2><p class="mute" style="margin:0 0 6px">${mem.length} ${t('Students')}, ${t('Paid')} ${m(sub)}</p><div class="fr fh"><span>${t('Name')}</span><span>${t('Paid')}</span><span>${t('Still needed')}</span></div>${mem.map(([x,i])=>`<div class="fr"><span>${E(`outreach.members.${i}.name`)}${S.ed?` <button class="x" data-a="mv" data-i="${i}">Move</button> ${del(`outreach.members.${i}`)}`:''}</span><span>${V(`outreach.members.${i}.paid`)}</span><span>${F?m(nd(x)):'-'}</span></div>`).join('')}</div>`}).join('')+add('outreach.members')}
};
function sheet(){const s=D.students[S.open];return `<div class="ov" data-a="close"><div class="sh" role="dialog"><img src="${s.photo}" alt=""><h2>${esc(s.name)}</h2><p class="mute">${esc(t(s.born))}</p><p class="mute">${esc(s.gender)}, ${esc(t(s.from))}</p>${s.pray?`<span class="chip">${t('Praying together')}</span>`:''}</div></div>`}
function render(){document.documentElement.lang=S.lang;$('#app').innerHTML=`<header class="top"><img src="${D.icon}" alt=""><b>${esc(D.meta.brand)}</b><span class="sp"></span>${S.can?`<button class="pill ${S.ed?'on':''}" data-a="edit">${S.ed?'Editing':'Edit'}</button>`:''}<button class="pill" data-a="theme" aria-label="Light or dark">◐</button><button class="pill" data-a="lang">${S.lang==='km'?'EN':'ខ្មែរ'}</button></header>
<nav class="tabs">${TABS.map(([k,n,i])=>`<button class="tab ${S.tab===k?'on':''}" data-a="tab" data-k="${k}">${i}${esc(t(n))}</button>`).join('')}</nav>
<main>${VIEWS[S.tab]()}</main>${S.open!=null?sheet():''}${S.ed?`<div class="bar"><span>${esc(S.msg||'Editing. Changes are private until you publish.')}</span><button data-a="save">Publish changes</button><button data-a="discard">Discard</button></div>`:''}`}
function pick(p){const f=document.createElement('input');f.type='file';f.accept='image/*';f.onchange=()=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,480/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);put(p,c.toDataURL('image/jpeg',.82));render()};im.src=r.result};r.readAsDataURL(f.files[0])};f.click()}
async function publish(){if(!ART)return;const c=document.documentElement.cloneNode(true);c.querySelector('#app').innerHTML='';c.querySelector('#data').textContent=JSON.stringify(D).replace(/</g,'\\u003c');c.setAttribute('lang','en');c.removeAttribute('data-theme');S.msg='Publishing...';render();
try{await ART.publish('<!DOCTYPE html>\n'+c.outerHTML)}catch(e){S.msg=e&&e.code==='conflict'?'Someone else published first. Reload to see their version.':'Could not publish: '+((e&&e.message)||e);render()}}
const keep=(k,v)=>{try{localStorage.setItem('gpdts_'+k,v)}catch(e){}};
document.addEventListener('input',e=>{const p=e.target.dataset&&e.target.dataset.p;if(p&&e.target.isContentEditable)put(p,e.target.textContent)});
document.addEventListener('click',e=>{const a=e.target.closest('[data-a]');if(!a)return;const k=a.dataset.a,p=a.dataset.p,i=+a.dataset.i;
if(k==='close'&&e.target!==a)return;
if(k==='pray'){D.students[i].pray=a.checked;return}
if(k==='ses'){const s=D.schedule[S.day].slots[+a.dataset.j];s.s=a.checked;s.r=s.r||'';render();return}
if(k==='tab'){S.tab=a.dataset.k;keep('tab',S.tab);render();scrollTo(0,0)}
else if(k==='lang'){S.lang=S.lang==='km'?'en':'km';keep('lang',S.lang);render()}
else if(k==='theme'){const r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;r.dataset.theme=dark?'light':'dark';keep('theme',r.dataset.theme)}
else if(k==='edit'){S.ed=!S.ed;S.msg='';if(S.ed)S.lang='en';render()}
else if(k==='open'){S.open=i;render()}
else if(k==='close'){S.open=null;render()}
else if(k==='day'){S.day=i;render()}
else if(k==='add'){get(p).push(NEW[p.split('.').pop()]());render()}
else if(k==='del'){const q=p.split('.'),n=+q.pop();get(q.join('.')).splice(n,1);render()}
else if(k==='photo'){pick(p)}
else if(k==='save'){publish()}
else if(k==='mv'){const x=D.outreach.members[i];x.team=(x.team+1)%D.outreach.teams.length;render()}
else if(k==='copy'){try{navigator.clipboard.writeText(D.fees.account.replace(/\s/g,''));a.textContent='Copied'}catch(e){}}
else if(k==='discard'){location.reload()}});
addEventListener('keydown',e=>{if(e.key==='Escape'&&S.open!=null){S.open=null;render()}});
try{S.lang=localStorage.getItem('gpdts_lang')==='km'?'km':'en';S.tab=localStorage.getItem('gpdts_tab')||'home';const th=localStorage.getItem('gpdts_theme');if(th)document.documentElement.dataset.theme=th}catch(e){}
if(!VIEWS[S.tab])S.tab='home';
render();
(async()=>{try{const c=window.claude;if(!c)return;const u=await c.use('user');ART=await c.use('artifact');S.can=!!(ART&&u&&u.canEdit&&u.canEdit());if(S.can)render()}catch(e){}})();
</script>


</body></html>
